[project]
name = "sector-rotation-scanner"
version = "0.1.0"
description = "NSE Sector Rotation & Trend Leadership Scanner (discovery only, no orders)"
requires-python = ">=3.12"
dependencies = [
    "kiteconnect>=5.0.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "streamlit>=1.38",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
